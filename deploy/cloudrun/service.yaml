# Cloud Run multi-container service for adk-leak-arena (public mode) + AlloyDB Express Auth Proxy sidecar.
# No secrets are stored here: ARENA_DB_DSN / MEMSHIELD_DB_DSN are mounted from Secret Manager (`arena-db-dsn`).
# Deploy with:
#   gcloud run services replace deploy/cloudrun/service.yaml --region=asia-southeast1 --project=memshield-buildathon
#   gcloud run services add-iam-policy-binding adk-leak-arena --region=asia-southeast1 \
#     --member=allUsers --role=roles/run.invoker --project=memshield-buildathon
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: adk-leak-arena
  labels:
    cloud.googleapis.com/location: asia-southeast1
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/container-dependencies: '{"arena":["alloydb-proxy"]}'
    spec:
      containerConcurrency: 20
      timeoutSeconds: 300
      serviceAccountName: adk-leak-arena-sa@memshield-buildathon.iam.gserviceaccount.com
      containers:
        - name: arena
          image: asia-southeast1-docker.pkg.dev/memshield-buildathon/memshield-repo/adk-leak-arena:0.2.1-q0
          ports:
            - name: http1
              containerPort: 8090
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
          env:
            - name: ARENA_PUBLIC_MODE
              value: "1"
            - name: ARENA_STARTUP_BASELINE
              value: "0"
            - name: ARENA_STATE_DIR
              value: /tmp/adk-leak-arena
            - name: ARENA_DB_CONNECT_WAIT_S
              value: "60"
            - name: ARENA_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: arena-db-dsn
                  key: latest
            - name: MEMSHIELD_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: arena-db-dsn
                  key: latest
          startupProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 0
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
        - name: alloydb-proxy
          image: gcr.io/alloydb-connectors/alloydb-auth-proxy:1.18.0
          args:
            - "--address=127.0.0.1"
            - "--port=5432"
            - "--public-ip"
            - "--structured-logs"
            - "--health-check"
            - "--http-address=0.0.0.0"
            - "--http-port=9090"
            - "projects/memshield-buildathon/locations/asia-southeast1/clusters/memshield-express/instances/primary"
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /startup
              port: 9090
            initialDelaySeconds: 0
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30

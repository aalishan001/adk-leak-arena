name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_admin_pass
          POSTGRES_DB: memshield
        ports:
          - 54330:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memshield"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports:
          - 56333:6333

    env:
      ARENA_DB_DSN: postgresql://memshield_app:memshield_pass@localhost:54330/memshield
      ARENA_ADMIN_DSN: postgresql://postgres:postgres_admin_pass@localhost:54330/memshield
      ARENA_STARTUP_BASELINE: "0"
      OLLAMA_BASE_URL: http://127.0.0.1:9
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
      ARENA_QDRANT_URL: http://localhost:56333
      ARENA_REQUIRE_QDRANT: "1"
      MEM0_TELEMETRY: "False"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache FastEmbed model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5

      - name: Install
        run: python -m pip install -e ".[dev,qdrant]"

      - name: Apply arena schema
        run: psql "$ARENA_ADMIN_DSN" -v ON_ERROR_STOP=1 -f sql/init_arena.sql

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:56333/readyz && exit 0
            sleep 2
          done
          echo "Qdrant did not become ready" && exit 1

      - name: Test suite
        run: pytest -v

      - name: Evaluation matrix (0.1.0 scenarios, gate on)
        run: leak-arena eval --format markdown

      - name: CI gate on the 0.2.0 scenarios (S7-S9) with a recall floor
        run: leak-arena eval --scenarios S7,S8,S9 --targets unprotected,memshield,qdrant --min-recall 1.0 --format markdown
